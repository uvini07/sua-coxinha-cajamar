    <style>
      * { margin: 0; box-sizing: border-box; }
      body {
        width: 1200px; height: 630px; overflow: hidden; position: relative;
        background: #141415; color: #fff; font-family: 'Satoshi', system-ui, sans-serif;
      }
      /* metade amarela na diagonal, igual à primeira tela do site */
      .amarelo { position: absolute; inset: 0; background: #f9c115; clip-path: polygon(58% 0, 100% 0, 100% 100%, 30% 100%); }
      .conteudo { position: absolute; inset: 0; padding: 62px 70px; display: flex; flex-direction: column; justify-content: space-between; }
      .marca { display: flex; align-items: center; gap: 18px; }
      .marca svg { width: 300px; height: auto; color: #fff; }
      .unidade { color: #f9c115; font-size: 30px; font-weight: 900; letter-spacing: .02em; }
      h1 {
        font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-stretch: 75%;
        font-size: 104px; line-height: .88; letter-spacing: -.02em; color: #f9c115; max-width: 9ch;
      }
      p { margin-top: 22px; font-size: 30px; font-weight: 500; line-height: 1.35; max-width: 17ch; }
      .tags { display: flex; gap: 12px; }
      .tag { padding: 12px 24px; border-radius: 999px; background: #f9c115; color: #141415; font-size: 25px; font-weight: 900; }
      .coxinha { position: absolute; right: 40px; top: 58px; width: 440px; rotate: 4deg; filter: drop-shadow(0 30px 40px rgba(0,0,0,.45)); }
      .churros { position: absolute; right: 386px; bottom: -70px; width: 360px; rotate: -8deg; filter: drop-shadow(0 30px 40px rgba(0,0,0,.4)); }
    </style>
